plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'war'
}

// 순환 참조 허용 설정 추가
springBoot {
    mainClass = 'com.hanin.pda.HaninpdaApplication'
}

group = 'com.haninpda'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17' // OpenJDK 17 사용을 위해 수정

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.session:spring-session-core'
    
    // Mybatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.3'
    
    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'mysql:mysql-connector-java:8.0.22'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:7.2.2.jre8'
    
    // Utils
    implementation 'org.javassist:javassist:3.23.1-GA'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    implementation 'log4j:log4j:1.2.17'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'com.google.code.gson:gson'
    implementation 'commons-codec:commons-codec'
    implementation 'commons-io:commons-io:2.6'
    implementation 'commons-fileupload:commons-fileupload:1.4'
    implementation 'com.servlets:cos:09May2002'
    
    // JSON & JWT
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // JSP & Tiles
    providedCompile 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'javax.servlet:jstl'
    implementation 'org.apache.tiles:tiles-api:3.0.7'
    implementation 'org.apache.tiles:tiles-core:3.0.7'
    implementation 'org.apache.tiles:tiles-servlet:3.0.7'
    implementation 'org.apache.tiles:tiles-template:3.0.7'
    implementation 'org.apache.tiles:tiles-jsp:3.0.8'
    implementation 'org.apache.tiles:tiles-autotag-core-runtime:1.1.0'
    implementation 'org.apache.tiles:tiles-request-api:1.0.6'
    implementation 'org.apache.tiles:tiles-request-jsp:1.0.6'
    implementation 'org.apache.tiles:tiles-request-servlet:1.0.6'

    // Swagger
    implementation 'io.springfox:springfox-swagger2:2.8.0'
    implementation 'io.springfox:springfox-swagger-ui:2.8.0'

    // System Path Library (external-lib)
    implementation files('src/main/resources/external-lib/java-jwt-3.8.1.jar')

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

test {
    useJUnitPlatform()
}
